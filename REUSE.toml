version = 1

[[annotations]]
path = [
  ".gitignore",
  ".gitmodules",
  ".tool-versions",
  "REUSE.toml",
  "examples/elixir/.gitignore",
  "examples/elixir/mix.lock",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [
  ".github/workflows/*.yml",
  "CMakeLists.txt",
  "README.md",
  "docs/**",
  "include/**",
  "lgfx_device/**",
  "lgfx_port/**",
  "lib/**",
  "mix.exs",
  "scripts/*.exs",
  "scripts/*.sh",
  "examples/elixir/.formatter.exs",
  "examples/elixir/config/**",
  "examples/elixir/lib/**",
  "examples/elixir/mix.exs",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Masatoshi Nishiguchi"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  "examples/elixir/priv/assets/icons/alert.rgb565",
  "examples/elixir/priv/assets/icons/close.rgb565",
  "examples/elixir/priv/assets/icons/info.rgb565",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2020 lovyan03 (https://github.com/lovyan03)"
SPDX-License-Identifier = "BSD-2-Clause"

[[annotations]]
path = "examples/elixir/priv/assets/icons/piyopiyo.rgb565"
precedence = "aggregate"
SPDX-FileCopyrightText = "piyopiyo.ex contributors (https://github.com/piyopiyoex)"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "lgfx_device/fonts/generated/ui_font_ja_16_min.cpp"
precedence = "override"
SPDX-FileCopyrightText = [
  "2026 Masatoshi Nishiguchi",
  "2020 lovyan03 (https://github.com/lovyan03)",
  "lgfxFontSubsetGenerator contributors (https://github.com/yamamaya/lgfxFontSubsetGenerator)",
]
